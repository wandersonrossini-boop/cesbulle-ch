<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KIDS</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js?v=70.3.90"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root {
            /* Navy Blue Dark Theme */
            --bg-dark: #090e17; /* Very dark navy */
            --card-bg: #111827; /* Slightly lighter */
            --border-line: #1f2937; /* Subtle border */
            
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
            
            --gold: #C9A050;
            --green: #10B981;
            --red: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .container-kids {
            padding: 30px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* HEADER */
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 2.2rem; font-weight: 800; color: var(--text-light); line-height: 1.1; margin-bottom: 5px; }
        .header p { font-size: 1.1rem; color: var(--text-muted); font-weight: 500; }

        /* TABS */
        .tabs-container { display: flex; gap: 30px; margin-bottom: 40px; border-bottom: 1px solid var(--border-line); }
        .tab-btn { background: transparent; border: none; padding: 0 0 10px 0; color: var(--text-muted); font-weight: 700; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; position: relative; transition: 0.2s; }
        .tab-btn.active { color: var(--gold); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--gold); }

        /* SECTION TITLE */
        .section-title { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }

        /* CARD STYLE */
        .kid-card {
            background: var(--card-bg);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .kid-info-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .kid-name { font-size: 1.15rem; font-weight: 700; color: var(--text-light); margin-bottom: 4px; }
        .kid-parent { font-size: 0.9rem; color: var(--text-muted); }
        .kid-age { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

        .actions-row { display: flex; justify-content: flex-end; align-items: center; gap: 25px; border-top: 1px solid var(--border-line); padding-top: 12px; margin-top: 5px; }
        
        .btn-confirm { background: transparent; color: var(--gold); border: none; font-size: 0.85rem; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s; }
        .btn-confirm:hover { color: #fff; }
        
        .btn-checkout { background: transparent; color: var(--text-muted); border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: color 0.2s; }
        .btn-checkout:hover { color: var(--red); }

        .presence-status { font-size: 0.85rem; color: var(--green); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .presence-status::before { content: ''; display: block; width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

        /* PRESENCE LIST */
        .presence-container { margin-top: 50px; }
        .presence-header { display: flex; align-items: center; gap: 8px; padding-bottom: 20px; cursor: pointer; }
        .presence-title { font-size: 0.95rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container-kids">
        <div class="header">
            <h1>KIDS</h1>
            <p>Identificação e cuidado</p>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" id="tab-bercario" onclick="setAgeFilter('0-3')">BERÇÁRIO 0–3</button>
            <button class="tab-btn" id="tab-kids" onclick="setAgeFilter('4+')">KIDS 4+</button>
        </div>

        <div class="section-title">CRIANÇAS AGUARDANDO</div>
        
        <div id="kids-list-waiting">
            <div style="text-align:center; color:var(--text-muted); margin-top:30px;"><i class="fas fa-spinner fa-spin"></i> Sincronizando...</div>
        </div>

        <div class="presence-container">
            <div class="presence-header" onclick="togglePresenceList()">
                <div class="presence-title" id="presence-header-title">PRESENÇAS HOJE &middot; 0</div>
            </div>
            
            <div id="presence-list-content" style="display:none;">
                <div id="kids-list-active"></div>
                <div style="display: flex; justify-content: center; margin-top: 30px; border-top: 1px solid var(--border-line); padding-top: 25px;">
                    <button onclick="endKidsSession()" style="background:transparent; border:none; color:var(--red); font-weight:600; cursor:pointer; text-transform:uppercase; font-size: 0.75rem; letter-spacing: 1px; opacity: 0.7;">
                        Encerrar Todos
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const db = firebase.firestore();
        const todayStart = new Date();
        todayStart.setHours(0,0,0,0);
        let currentAgeFilter = '0-3';
        let windowDocs = [];

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                initKidsMonitor();
            }
        });

        function initKidsMonitor() {
            db.collection('attendance')
                .where('type', '==', 'kids')
                .onSnapshot(snap => {
                    windowDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderLists();
                });
        }

        function setAgeFilter(filter) {
            currentAgeFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(filter === '0-3') document.getElementById('tab-bercario').classList.add('active');
            else document.getElementById('tab-kids').classList.add('active');
            renderLists();
        }

        function renderLists() {
            const listWaiting = document.getElementById('kids-list-waiting');
            const listActive = document.getElementById('kids-list-active');
            listWaiting.innerHTML = ''; listActive.innerHTML = '';

            let filtered = windowDocs;
            if (currentAgeFilter === '0-3') {
                filtered = windowDocs.filter(d => {
                    const ag = (d.age_group || '').toLowerCase();
                    return ag.includes('0-3') || ag.includes('berço') || ag.includes('berçário') || ag.includes('bebe');
                });
            } else {
                filtered = windowDocs.filter(d => {
                    const ag = (d.age_group || '').toLowerCase();
                    return !ag.includes('0-3') && !ag.includes('berço') && !ag.includes('berçário') && !ag.includes('bebe');
                });
            }

            const waiting = filtered.filter(d => d.status === 'waiting_kids_confirm');
            const active = filtered.filter(d => (d.status === 'confirmed' || d.status === 'present') && d.timestamp?.toDate() >= todayStart);

            if(waiting.length === 0) listWaiting.innerHTML = '<div style="color:var(--text-muted); padding:20px 0;">Nenhuma criança aguardando.</div>';
            waiting.forEach(d => {
                const item = document.createElement('div');
                item.className = 'kid-card';
                item.innerHTML = `
                    <div class="kid-info-row">
                        <div>
                            <div class="kid-name">${d.name}</div>
                            <div class="kid-parent">Responsável: ${d.parent_name || 'N/A'}</div>
                        </div>
                        <div class="kid-age">${d.age_group || ''}</div>
                    </div>
                    <div class="actions-row">
                        <button class="btn-confirm" onclick="updateStatus('${d.id}', 'confirmed')">Confirmar</button>
                    </div>
                `;
                listWaiting.appendChild(item);
            });

            document.getElementById('presence-header-title').innerHTML = `PRESENÇAS HOJE &middot; ${active.length}`;
            active.forEach((d, i) => {
                const item = document.createElement('div');
                item.className = 'kid-card';
                item.innerHTML = `
                    <div class="kid-info-row">
                        <div>
                            <div class="kid-name">${d.name}</div>
                            <div class="kid-parent">Responsável: ${d.parent_name || 'N/A'}</div>
                        </div>
                        <div class="kid-age">${d.age_group || ''}</div>
                    </div>
                    <div class="actions-row">
                        <div class="presence-status">Sala ativa</div>
                        <button class="btn-checkout" onclick="checkoutKid('${d.id}', '${d.name}')">Encerrar</button>
                    </div>
                `;
                listActive.appendChild(item);
            });
        }

        function updateStatus(id, status) {
            db.collection('attendance').doc(id).update({ status: status });
        }
        
        function checkoutKid(id, name) {
            if(confirm(`Deseja encerrar a presença de ${name}?`)) {
                updateStatus(id, 'finished');
            }
        }

        function togglePresenceList() {
            const content = document.getElementById('presence-list-content');
            content.style.display = content.style.display === 'none' ? 'block' : 'none';
        }

        function endKidsSession() {
            if(confirm("Deseja encerrar a sala e limpar a lista?")) {
                const batch = db.batch();
                windowDocs.filter(d => d.status === 'confirmed' || d.status === 'present').forEach(d => {
                    batch.update(db.collection('attendance').doc(d.id), { status: 'finished' });
                });
                batch.commit();
            }
        }
    </script>
</body>
</html>
