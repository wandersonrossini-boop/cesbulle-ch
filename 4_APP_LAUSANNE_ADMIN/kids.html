<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids - Catedral Lausanne</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js?v=70.3.49"></script>
    <script src="js/auth-manager.js?v=70.3.49"></script>

    <style>
        :root {
            --gold: #C9A050;
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --border: #E2E8F0;
            --font: 'Outfit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg); color: var(--text); font-family: var(--font);
            padding: 20px; padding-bottom: 100px;
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: var(--text); margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .header p { color: var(--gold); margin: 5px 0 0 0; font-size: 0.8rem; font-weight: 600; letter-spacing: 4px; }

        .container-kids { max-width: 600px; margin: 0 auto; }

        /* TABS STYLING */
        .tabs-container { display: flex; gap: 15px; margin-bottom: 30px; justify-content: center; }
        .tab-btn {
            background: var(--card-bg); border: 1px solid var(--border); padding: 15px 25px;
            border-radius: 20px; cursor: pointer; font-family: var(--font); font-weight: 700;
            color: var(--text); transition: 0.3s; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .tab-btn.active { background: var(--gold); color: #fff; border-color: var(--gold); }

        /* CARDS */
        .kid-card {
            background: var(--card-bg); border-radius: 25px; padding: 25px; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s;
        }
        .kid-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .kid-info h3 { margin: 0; color: var(--text); font-size: 1.2rem; font-weight: 800; }
        .kid-info p { margin: 5px 0 0 0; color: #64748b; font-size: 0.9rem; }

        .actions { display: flex; gap: 10px; }
        .btn-confirm { background: var(--gold); color: #fff; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; }
        .btn-cancel { background: transparent; color: #ef4444; border: 1px solid #fca5a5; padding: 12px 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .btn-cancel:hover { background: #fee2e2; border-color: #ef4444; }

        /* PRESENCE LIST */
        .presence-container {
            background: var(--card-bg); border-radius: 25px; padding: 30px;
            border: 1px solid var(--border); margin-top: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .presence-item {
            display: flex; align-items: center; padding: 15px 0;
            border-bottom: 1px solid #f1f5f9; font-size: 1rem;
        }
        .presence-number { color: var(--gold); font-weight: 800; min-width: 40px; }
        .presence-name { font-weight: 600; color: var(--text); margin-right: 15px; }
        .presence-age { color: #64748b; font-size: 0.8rem; text-transform: uppercase; }
    </style>
</head>

<body>
    <div class="header">
        <img src="assets/logo_3.png?v=70.3.49" style="width: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--gold));">
        <h1>KIDS</h1>
        <p>IDENTIFICAÇÃO E CUIDADO</p>
    </div>

    <div class="container-kids">
        <div class="tabs-container">
            <button class="tab-btn active" id="tab-bercario" onclick="setAgeFilter('0-3')">BERÇÁRIO (0-3)</button>
            <button class="tab-btn" id="tab-kids" onclick="setAgeFilter('4+')">KIDS (4+)</button>
        </div>

        <div id="kids-list-waiting">
            <div style="text-align:center; color:#444; margin-top:50px;"><i class="fas fa-spinner fa-spin"></i> SINCRONIZANDO...</div>
        </div>

        <div class="presence-container">
            <h2 onclick="togglePresenceList()" style="color: var(--gold); font-size: 1rem; margin: 0 0 20px 0; display:flex; align-items:center; gap:10px; font-weight: 800; cursor:pointer; text-transform: uppercase; letter-spacing: 2px;">
                <i class="fas fa-list-ul"></i> PRESENÇAS
                <span style="font-size:0.8rem; background:rgba(201,160,80,0.1); padding:5px 15px; border-radius:20px; margin-left:auto;">
                    TOTAL: <strong id="kids-count-active">0</strong>
                </span>
            </h2>
            <div id="presence-list-content" style="display:none;">
                <div id="kids-list-active"></div>
                <button onclick="endKidsSession()" style="margin-top:30px; width:100%; background:transparent; border:1px solid #ff4444; color:#ff4444; padding:15px; border-radius:15px; cursor:pointer; font-weight:800; text-transform: uppercase; font-size: 0.75rem;">
                    <i class="fas fa-power-off"></i> ENCERRAR SALA
                </button>
            </div>
        </div>
    </div>

    <script>
        const db = firebase.firestore();
        const todayStart = new Date();
        todayStart.setHours(0,0,0,0);
        let currentAgeFilter = '0-3';
        let windowDocs = [];

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                initKidsMonitor();
            }
        });

        function initKidsMonitor() {
            db.collection('attendance')
                .where('type', '==', 'kids')
                .onSnapshot(snap => {
                    windowDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderLists();
                });
        }

        function setAgeFilter(filter) {
            currentAgeFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(filter === '0-3') document.getElementById('tab-bercario').classList.add('active');
            else document.getElementById('tab-kids').classList.add('active');
            renderLists();
        }

        function renderLists() {
            const listWaiting = document.getElementById('kids-list-waiting');
            const listActive = document.getElementById('kids-list-active');
            listWaiting.innerHTML = ''; listActive.innerHTML = '';

            let filtered = windowDocs;
            if (currentAgeFilter === '0-3') {
                filtered = windowDocs.filter(d => {
                    const ag = (d.age_group || '').toLowerCase();
                    return ag.includes('0-3') || ag.includes('berçário') || ag.includes('bebe');
                });
            } else {
                filtered = windowDocs.filter(d => {
                    const ag = (d.age_group || '').toLowerCase();
                    return !ag.includes('0-3') && !ag.includes('berçário') && !ag.includes('bebe');
                });
            }

            const waiting = filtered.filter(d => d.status === 'waiting_kids_confirm');
            const active = filtered.filter(d => (d.status === 'confirmed' || d.status === 'present') && d.timestamp?.toDate() >= todayStart);

            if(waiting.length === 0) listWaiting.innerHTML = '<div style="text-align:center; color:#333; padding:40px;">NENHUM AGUARDANDO</div>';
            waiting.forEach(d => {
                const card = document.createElement('div');
                card.className = 'kid-card';
                card.innerHTML = `
                    <div class="kid-info">
                        <h3>${d.name}</h3>
                        <p>${d.age_group || ''} ${d.parent_name ? ' • ' + d.parent_name : ''}</p>
                    </div>
                    <div class="actions">
                        <button class="btn-cancel" onclick="updateStatus('${d.id}', 'cancelled')"><i class="fas fa-times"></i></button>
                        <button class="btn-confirm" onclick="updateStatus('${d.id}', 'confirmed')">CONFIRMAR</button>
                    </div>
                `;
                listWaiting.appendChild(card);
            });

            document.getElementById('kids-count-active').innerText = active.length;
            active.forEach((d, i) => {
                const item = document.createElement('div');
                item.className = 'presence-item';
                item.innerHTML = `<div class="presence-number">#${i+1}</div><div class="presence-name">${d.name}</div><div class="presence-age">${d.age_group || ''}</div>`;
                listActive.appendChild(item);
            });
        }

        function updateStatus(id, status) {
            db.collection('attendance').doc(id).update({ status: status });
        }

        function togglePresenceList() {
            const content = document.getElementById('presence-list-content');
            content.style.display = content.style.display === 'none' ? 'block' : 'none';
        }

        function endKidsSession() {
            if(confirm("Deseja encerrar a sala e limpar a lista?")) {
                const batch = db.batch();
                windowDocs.filter(d => d.status === 'confirmed' || d.status === 'present').forEach(d => {
                    batch.update(db.collection('attendance').doc(d.id), { status: 'finished' });
                });
                batch.commit();
            }
        }
    </script>
</body>
</html>
