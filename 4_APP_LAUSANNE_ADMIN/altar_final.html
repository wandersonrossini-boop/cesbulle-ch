<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js?v=70.3.79"></script>
    <script src="js/auth-manager.js?v=70.3.79"></script>
    <link rel="icon" type="image/png" href="assets/logo_3.png?v=70.3.79">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Altar | Catedral Lausanne</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Outfit:wght@200;300;400;500;600;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #C9A050;
            --gold-dim: rgba(201, 160, 80, 0.08);
            --gold-glowing: rgba(201, 160, 80, 0.15);
            --bg: #050505;
            --text: #ffffff;
            --border: rgba(201, 160, 80, 0.12);
            --font: 'Outfit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            color: var(--text); 
            font-family: var(--font);
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(201, 160, 80, 0.05) 0%, transparent 60%),
                linear-gradient(135deg, rgba(201, 160, 80, 0.01) 0%, transparent 50%);
        }

        .watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 15vw; font-weight: 900; color: rgba(201, 160, 80, 0.01); z-index: 0; pointer-events: none;
            font-family: 'Playfair Display', serif;
        }

        .container { 
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; 
            padding: 35px 40px; gap: 25px; 
            z-index: 10;
        }

        /* HEADER */
        .pc-only { display: block; }
        @media (max-width: 900px) {
            .header-left { flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 15px; }
            .time-display { font-size: 2rem; line-height: 1; }
            .topbar { margin-bottom: 15px; }
            .mobile-brand-bar { margin-bottom: 10px !important; }
            .container { padding: 15px 15px 0 15px; }
 .exit-btn { display: none !important; } }
        @media (max-width: 900px) {
            .pc-only { display: none !important; }
            .mobile-brand-bar { display: flex !important; }
        }
        .topbar { display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 25px; }
        
        .logo-box { width: 55px; height: 55px; filter: drop-shadow(0 0 10px rgba(201, 160, 80, 0.2)); }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }

        .clock-box { display: flex; flex-direction: column; }
        #clock { font-size: 3.5rem; font-weight: 200; line-height: 1; color: var(--text); letter-spacing: -1px; }
        
        #timer-label { 
            font-size: 0.72rem; font-weight: 700; color: var(--gold); letter-spacing: 1.5px; 
            display: flex; align-items: center; gap: 6px; text-transform: uppercase;
            margin-top: 4px;
        }
        .live-dot {
            width: 7px; height: 7px; background: var(--gold); border-radius: 50%;
            box-shadow: 0 0 8px var(--gold); animation: pulse 2.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* STATS CARDS */
        .stats-row { display: flex; gap: 15px; }
        .stat-btn {
            background: rgba(22, 21, 22, 0.45); border: 1px solid var(--border); border-radius: 20px;
            padding: 16px 24px; min-width: 160px; display: flex; flex-direction: column;
            align-items: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .stat-btn:hover {
            border-color: rgba(201, 160, 80, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }
        .stat-btn.active { 
            border-color: var(--gold); background: rgba(201, 160, 80, 0.05); 
            box-shadow: 0 0 25px rgba(201, 160, 80, 0.15); 
        }
        .stat-btn span { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: #a8a29e; letter-spacing: 1.5px; margin-bottom: 6px; }
        .stat-btn .val { font-size: 2.8rem; font-weight: 300; color: var(--text); line-height: 1.1; }
        .stat-btn.active .val { color: var(--gold); font-weight: 500; }
        .stat-btn.active span { color: #ffffff; }

        /* LIST PANELS */
        .main-view { flex: 1; display: flex; overflow: hidden; justify-content: center; }
        
        .feed-col { 
            width: 100%; max-width: 1100px; 
            background: rgba(22, 21, 22, 0.35); border: 1px solid var(--border); 
            border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); 
            display: none; flex-direction: column; overflow: hidden;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .feed-col.active { display: flex; }

        .col-header { padding: 25px 40px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .col-header h2 { 
            font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; 
            position: relative; display: inline-block; padding-bottom: 8px;
        }
        .col-header h2::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 45px; height: 2px;
            background: var(--gold); border-radius: 1px;
        }

        .col-list { 
            flex: 1; overflow-y: auto; padding: 30px 40px; 
            scrollbar-width: thin; scrollbar-color: rgba(201, 160, 80, 0.2) transparent;
        }
        .col-list::-webkit-scrollbar { width: 6px; }
        .col-list::-webkit-scrollbar-thumb { background-color: rgba(201, 160, 80, 0.2); border-radius: 3px; }

        .card { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(201, 160, 80, 0.1); border-radius: 20px; 
            padding: 25px; margin-bottom: 20px; transition: all 0.3s ease;
        }
        .card:hover {
            border-color: rgba(201, 160, 80, 0.25);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-1px);
        }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-name { font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 700; color: #ffffff; }
        .card-time { 
            font-size: 0.75rem; font-weight: 700; color: var(--gold); background: var(--gold-dim); 
            padding: 5px 12px; border-radius: 12px; border: 1px solid rgba(201, 160, 80, 0.15);
            letter-spacing: 0.5px;
        }
        .card-detail { font-size: 1.05rem; color: #a8a29e; line-height: 1.6; font-weight: 400; }

        /* CIRCULAR BACK BUTTON (Bottom Right matching mockup) */
        .exit-btn {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; 
            background: rgba(22, 21, 22, 0.6); border: 1px solid var(--border); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #ffffff;
            font-size: 1.15rem; cursor: pointer; z-index: 100; transition: all 0.3s ease;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-decoration: none;
        }
        .exit-btn:hover {
            border-color: var(--gold); background: rgba(201, 160, 80, 0.15);
            box-shadow: 0 0 15px rgba(201, 160, 80, 0.25); transform: scale(1.05);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 900px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                padding: 15px 20px;
            }
            .stats-row {
                width: 100%;
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 10px;
            }
            .stat-btn {
                min-width: unset;
                flex: 1 1 calc(33.333% - 10px);
                padding: 12px 10px;
            }
            .stat-btn span {
                font-size: 0.65rem;
            }
            .stat-btn .val {
                font-size: 2rem;
            }
            #btn-e {
                display: none !important;
            }
            
            
        }
        
    
        /* MODAL MAIS */
        .modal-mais {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-mais-content {
            background: #121418;
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            overflow: hidden;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding-bottom: 10px;
        }
        .modal-mais-header {
            padding: 20px;
            display: flex;
            justify-content: flex-end;
        }
        .modal-mais-btn {
            padding: 18px 25px;
            color: #E2E8F0;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-mais-btn:active { background: rgba(255,255,255,0.03); }
        .modal-mais-btn.gold { color: var(--gold); }
        .modal-mais-divider { height: 1px; background: rgba(255,255,255,0.05); margin: 0 25px; }
        .modal-mais-spacer { height: 20px; }

        @media (max-width: 900px) {
            #col-e.active {
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: var(--bg);
                z-index: 1000;
                overflow-y: auto;
                padding: 0;
            }
            .mobile-escala-header {
                display: flex !important;
                align-items: center;
                gap: 15px;
                padding: 20px;
                background: rgba(255,255,255,0.02);
                border-bottom: 1px solid var(--border);
                position: sticky; top: 0; z-index: 10;
                backdrop-filter: blur(10px);
            }
            #col-e .col-list { padding: 20px; }
            #col-e .col-header { display: none !important; }
        }
        .mobile-escala-header { display: none; }

    </style>
</head>
<body>
    <div class="watermark">LAUSANNE</div>
    
    <a href="#" onclick="logout()" class="exit-btn" title="Voltar ao Portal">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="container">
        <div class="topbar">
            <div class="mobile-brand-bar" style="display: none; width: 100%; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                <div class="brand-text">
                    <h2 style="font-family: var(--font-serif); font-size: 1.15rem; color: #fff; margin: 0; line-height: 1.1;">CME<br>LAUSANNE</h2>
                    <div style="color: var(--gold); font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; margin-top: 4px;">OPERAÇÃO</div>
                </div>
                <div onclick="document.getElementById('modal-mais').style.display='flex';" style="color: var(--gold); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                    <span style="font-size: 0.75rem; font-weight: 700;">Mais</span>
                    <i class="fas fa-bars" style="font-size: 1.2rem;"></i>
                </div>
            </div>
            <div class="header-left">
                <div class="logo-box pc-only"><img src="assets/logo_3.png?v=70.3.79" alt="Logo"></div>
                <div class="clock-box">
                    <div id="clock">00:00</div>
                    <div id="timer-label">
                        <div class="live-dot"></div>
                        <span>Culto ao vivo</span>
                    </div>
                </div>
            </div>
            
            <div class="stats-row">
                <div class="stat-btn active" id="btn-e" onclick="setTab('e')">
                    <span>Escala</span>
                    <div class="val" id="val-e" style="font-size: 1.5rem; font-weight: 500; text-transform: uppercase; margin-top: 5px;">Culto</div>
                </div>
                <div class="stat-btn" id="btn-v" onclick="setTab('v')">
                    <span>Visitantes</span>
                    <div class="val" id="val-v">0</div>
                </div>
                <div class="stat-btn" id="btn-p" onclick="setTab('p')">
                    <span>Orações</span>
                    <div class="val" id="val-p">0</div>
                </div>
                <div class="stat-btn" id="btn-c" onclick="setTab('c')">
                    <span>Celebrações</span>
                    <div class="val" id="val-c">0</div>
                </div>
            </div>
            

        </div>

        <div class="main-view">
            <div class="feed-col active" id="col-e">
                <div class="mobile-escala-header">
                    <i class="fas fa-arrow-left" onclick="closeEscalaMobile()" style="cursor:pointer; font-size:1.2rem; color:#fff;"></i>
                    <h2 style="font-family: var(--font-heading); font-size: 1rem; color: #fff; margin:0; text-transform:uppercase; letter-spacing:1px; font-weight:700;">Escala de Culto</h2>
                </div>
                <div class="col-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h2>Escala de Culto</h2>
                    <button id="btn-print-escala" onclick="printActiveEscala()" style="background:var(--gold-dim); border:1px solid var(--border); color:var(--gold); border-radius:8px; padding:6px 15px; cursor:pointer; font-size:0.8rem; font-weight:800; display:none; transition: all 0.3s ease;">
                        <i class="fas fa-file-pdf"></i> Compartilhar PDF
                    </button>
                </div>
                <div class="col-list" id="list-e">
                    <div style="text-align:center; padding:50px; color:var(--text-dim);">Carregando escala do altar...</div>
                </div>
            </div>
            <div class="feed-col" id="col-v">
                <div class="col-header"><h2>Visitantes de Hoje</h2></div>
                <div class="col-list" id="list-v"></div>
            </div>
            <div class="feed-col" id="col-p">
                <div class="col-header"><h2>Pedidos de Oração</h2></div>
                <div class="col-list" id="list-p"></div>
            </div>
            <div class="feed-col" id="col-c">
                <div class="col-header"><h2>Celebrações</h2></div>
                <div class="col-list" id="list-c"></div>
            </div>
        </div>
    </div>

    <script>
        const db = firebase.firestore();
        let activeEscalaData = null;
        
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000); updateClock();

        

        function setTab(t) {
            const col = document.getElementById('col-'+t);
            if(t !== 'e' && window.innerWidth <= 900) {
                document.querySelector('.topbar').style.display = 'flex';
            }
            
            document.querySelectorAll('.stat-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.feed-col').forEach(c => c.classList.remove('active'));
            if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active');
            if(col) col.classList.add('active');
        }

        function toggleMaisMenu() {
            const modal = document.getElementById('modal-mais');
            if(modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
            }
        }

        function openEscalaMobile() {
            document.getElementById('modal-mais').style.display='none';
            setTab('e');
            if(window.innerWidth <= 900) {
                document.querySelector('.topbar').style.display = 'none';
            }
        }
        function closeEscalaMobile() {
            if(window.innerWidth <= 900) {
                document.querySelector('.topbar').style.display = 'flex';
                setTab('v'); 
            }
        }

        

        window.addEventListener('DOMContentLoaded', () => {
            if (window.innerWidth <= 900) {
                setTab('v');
            }
        });

        firebase.auth().onAuthStateChanged(user => {
            if(user) startMonitor();
            else {
                if (window.self !== window.top) {
                    console.log("Altar: Aguardando autenticação do painel pai...");
                } else {
                    location.href = 'mobile_v2.html';
                }
            }
        });

        // Reuseable empty state generator
        function getEmptyStateHtml(title, subtitle, svgPathContent) {
            return `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 120px 20px; text-align:center; animation: fadeIn 0.5s;">
                <div style="position:relative; margin-bottom:25px;">
                    <div style="position:absolute; top:8px; right:15px; width:6px; height:6px; background:#fff; border-radius:50%; box-shadow:0 0 10px 3px rgba(201,160,80,0.85); z-index:2;"></div>
                    <div style="border: 1px solid rgba(201,160,80,0.25); border-radius:50%; width:130px; height:130px; display:flex; align-items:center; justify-content:center; background: radial-gradient(circle, rgba(201,160,80,0.03) 0%, transparent 70%);">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <defs>
                                <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#C9A050" />
                                    <stop offset="100%" stop-color="#E0B45C" />
                                </linearGradient>
                            </defs>
                            ${svgPathContent}
                        </svg>
                    </div>
                </div>
                <h3 style="font-family:'Playfair Display', serif; font-size:1.45rem; color:#ffffff; font-weight:700; margin:0 0 8px 0; letter-spacing:-0.5px;">${title}</h3>
                <p style="font-size:0.92rem; color:#a8a29e; max-width:290px; margin:0; line-height:1.5; font-family:'Inter';">${subtitle}</p>
            </div>
            `;
        }

        const svgs = {
            v: `
                <path d="M12 11c2.209 0 4-1.791 4-4s-1.791-4-4-4-4 1.791-4 4 1.791 4 4 4z"/>
                <path d="M12 13c-3.866 0-7 2.686-7 6v2h14v-2c0-3.314-3.134-6-7-6z"/>
                <path d="M6.5 11c1.38 0 2.5-1.12 2.5-2.5S7.88 6 6.5 6 4 7.12 4 8.5 5.12 11 6.5 11z" opacity="0.4"/>
                <path d="M5.5 13.5c-2.485 0-4.5 1.79-4.5 4v2.5h3.5v-1.5c0-2.21 1.79-4 4-4" opacity="0.4"/>
                <path d="M17.5 11c1.38 0 2.5-1.12 2.5-2.5S18.88 6 17.5 6s-2.5 1.12-2.5 2.5 1.12 2.5 2.5 2.5z" opacity="0.4"/>
                <path d="M18.5 13.5c2.485 0 4.5 1.79 4.5 4v2.5h-3.5v-1.5c0-2.21-1.79-4-4-4" opacity="0.4"/>
            `,
            p: `
                <path d="M12 5v14M8 9h8" />
                <path d="M12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9-9 4.03-9 9 4.03 9 9 9z" opacity="0.4" />
            `,
            c: `
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            `
        };

        function startMonitor() {
            const today = new Date();
            today.setHours(0,0,0,0);

            // Load Escala in real-time
            loadActiveEscala();

            function processSnap(snap) {
                let s = { v:0, p:0, c:0 }, h = { v:'', p:'', c:'' };
                snap.forEach(doc => {
                    const d = doc.data();
                    const time = d.timestamp ? d.timestamp.toDate().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '--:--';
                    
                    if(d.type === 'visitante') {
                        s.v++;
                        h.v += `<div class="card"><div class="card-top"><span class="card-name">${d.name}</span><span class="card-time">${time}</span></div><span class="card-detail">${d.extra || 'Visitante'}</span></div>`;
                    }
                    if(d.origin === 'reception_live_prayer') {
                        s.p++;
                        h.p += `<div class="card"><div class="card-top"><span class="card-name">${d.name}</span><span class="card-time">${time}</span></div><span class="card-detail">${d.detail || 'Pedido de Oração'}</span></div>`;
                    }
                    if(d.type === 'convert' || (d.interests && d.interests.some(i => i.includes('Jesus')))) {
                        s.c++;
                        h.c += `<div class="card"><div class="card-top"><span class="card-name">${d.name}</span><span class="card-time">${time}</span></div><span class="card-detail" style="color:var(--gold); font-weight:800;">NOVA DECISÃO!</span></div>`;
                    }
                });
                
                document.getElementById('val-v').innerText = s.v;
                document.getElementById('val-p').innerText = s.p;
                document.getElementById('val-c').innerText = s.c;
                
                document.getElementById('list-v').innerHTML = h.v || getEmptyStateHtml('Nenhum visitante', 'Quando um novo visitante for registrado, ele aparecerá aqui.', svgs.v);
                document.getElementById('list-p').innerHTML = h.p || getEmptyStateHtml('Nenhuma oração', 'Quando um novo pedido de oração for enviado, ele aparecerá aqui.', svgs.p);
                document.getElementById('list-c').innerHTML = h.c || getEmptyStateHtml('Nenhuma celebração', 'Quando uma nova decisão por Jesus for feita, ela aparecerá aqui.', svgs.c);
            }

            db.collection('attendance')
              .where('timestamp', '>=', today)
              .orderBy('timestamp', 'desc')
              .onSnapshot(processSnap, err => {
                  console.warn("⚠️ Query com filtro falhou (pode ser índice pendente):", err.message);
                  db.collection('attendance').limit(100).onSnapshot(processSnap);
              });
        }

        // Real-time Escala Loader for Altar Panel
        function loadActiveEscala() {
            const listE = document.getElementById('list-e');
            const valE = document.getElementById('val-e');
            const printBtn = document.getElementById('btn-print-escala');
            
            db.collection('service_schedules')
              .where('status', '==', 'Publicada')
              .onSnapshot(snap => {
                  if(snap.empty) {
                      valE.innerText = "Culto";
                      printBtn.style.display = 'none';
                      listE.innerHTML = getEmptyStateHtml(
                          'Sem Escala',
                          'Não há nenhuma escala de culto publicada no momento.',
                          '<path d="M19 4H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM19 20H5V10h14v10z"/>'
                      );
                      return;
                  }
                  
                  const todayStr = new Date().toISOString().split('T')[0];
                  let selected = null;
                  const scales = [];
                  
                  snap.forEach(doc => {
                      const data = doc.data();
                      scales.push({ id: doc.id, ...data });
                  });
                  
                  // Sort scales by date ascending
                  scales.sort((a, b) => a.data.localeCompare(b.data));
                  
                  // 1. Try to find today's scale
                  selected = scales.find(s => s.data === todayStr);
                  
                  // 2. If not found, try to find the next upcoming scale
                  if(!selected) {
                      selected = scales.find(s => s.data > todayStr);
                  }
                  
                  // 3. If still not found, get the most recent past scale
                  if(!selected && scales.length > 0) {
                      selected = scales[scales.length - 1];
                  }
                  
                  if(selected) {
                      activeEscalaData = selected;
                      printBtn.style.display = 'block';
                      
                      if(selected.data === todayStr) {
                          valE.innerText = "Hoje";
                          valE.style.color = '#10b981';
                      } else {
                          const parts = selected.data.split('-');
                          valE.innerText = `${parts[2]}/${parts[1]}`;
                          valE.style.color = 'var(--gold)';
                      }
                      
                      renderEscalaContent(selected, listE);
                  } else {
                      valE.innerText = "Culto";
                      printBtn.style.display = 'none';
                      listE.innerHTML = getEmptyStateHtml(
                          'Sem Escala',
                          'Não há nenhuma escala de culto publicada no momento.',
                          '<path d="M19 4H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM19 20H5V10h14v10z"/>'
                      );
                  }
              }, err => {
                  console.error("Erro ao carregar escala:", err);
                  listE.innerHTML = '<div style="text-align:center; padding:50px; color:#ef4444;">Erro ao carregar escala.</div>';
              });
        }

            let displayDate = dateStrFormatted.replace(' DE ', ' ').replace(' DE ', ' ');
            if (escala.tipo_culto === 'Domingo Manhã') displayDate = displayDate.replace('DOMINGO', 'DOMINGO MANHÃ');
            else if (escala.tipo_culto === 'Terça-feira') displayDate = displayDate.replace('TERÇA-FEIRA', 'TERÇA');

            let programacaoHtml = '';

                        <span class="escala-resp">${item.responsavel ? item.responsavel.toUpperCase() : ''}</span>

            const part = escala.participantes || {};
